name: ✅ Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: python -m json.tool profile.config.json > /tmp/profile.config.valid.json
      - name: Compile scripts
        run: python -m compileall .github/scripts tests
      - name: Run profile tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate deterministic visual assets
        run: python .github/scripts/generate_assets.py
      - name: Validate profile structure
        run: python .github/scripts/validate_profile.py
