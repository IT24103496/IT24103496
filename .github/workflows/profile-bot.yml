name: 🤖 Profile Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Colombo
  push:
    branches: [main]
    paths:
      - profile.config.json
      - README.md
      - assets/**
      - .github/scripts/**
      - .github/workflows/profile-bot.yml
      - tests/**

permissions:
  contents: write

concurrency:
  group: profile-bot
  cancel-in-progress: true

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test profile logic
        run: python -m unittest discover -s tests -v

      - name: Generate design assets
        run: python .github/scripts/generate_assets.py

      - name: Update live profile blocks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/profile_bot.py

      - name: Validate final profile
        run: python .github/scripts/validate_profile.py

      - name: Commit visible changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if git diff --cached --quiet; then
            echo "No displayed public profile changes detected."
          else
            git commit -m "🤖 Refresh live profile signals"
            git push
          fi
